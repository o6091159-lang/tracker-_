<style>
:root{--bg:#141619;--s:#1c1f24;--s2:#252930;--ln:#303540;--tx:#e8eaed;--mu:#9aa0aa;--ac:#6b8fb3;--pro:#a14a55;--carb:#5f7fa6;--fat:#4f8a85;--fiber:#8c84a6;--cal:#6b8fb3;--ok:#6fa883;--wa:#c2a15a;--er:#b86565;--r:14px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}
.app{max-width:560px;margin:auto;padding:max(12px,env(safe-area-inset-top)) 14px 100px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:12px}.top .sp{flex:1}
.ib{min-width:42px;height:42px;border-radius:12px;background:var(--s);border:1px solid var(--ln);display:grid;place-items:center;position:relative;padding:0 8px;font-weight:700;font-size:13px}
.ib svg,.nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bdg{position:absolute;top:6px;inset-inline-end:6px;width:9px;height:9px;border-radius:50%;background:var(--wa)}
input[type=date]{background:var(--s);border:1px solid var(--ln);border-radius:12px;height:42px;padding:0 10px;color-scheme:dark}
.card{background:var(--s);border:1px solid var(--ln);border-radius:var(--r);padding:14px;margin-bottom:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid3 .card{padding:10px;min-width:0}
.rh{display:flex;justify-content:space-between;gap:6px;align-items:baseline;margin-bottom:8px;flex-wrap:wrap}.rh b{font-size:13px;color:var(--mu);font-weight:600}.rh span{font-weight:700;white-space:nowrap}
.big .rh span{font-size:24px}.bar{height:8px;background:#161616;border-radius:9px;overflow:hidden;position:relative}.bar i{display:block;height:100%;border-radius:9px;transition:width .3s}
small,.mu{color:var(--mu);font-size:12px}h3{margin:0 0 10px;font-size:15px}h3 small{margin-inline-start:6px}
.meal{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}.meal:first-of-type{border-top:0}.meal>div:first-child{flex:1;min-width:0}.meal b{display:block;overflow-wrap:anywhere}
.emp{text-align:center;color:var(--mu);padding:16px 0;margin:0}
.fab{position:fixed;bottom:calc(74px + env(safe-area-inset-bottom));inset-inline-end:max(16px,calc(50% - 264px));width:56px;height:56px;border-radius:16px;background:var(--ac);color:#10141a;display:grid;place-items:center;box-shadow:0 4px 14px #0006;z-index:20}.fab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--s);border-top:1px solid var(--ln);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:15}
.nav div{display:flex;width:100%;max-width:560px}.nav button{flex:1;padding:9px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mu)}.nav .on{color:var(--tx);box-shadow:inset 0 2px 0 var(--ac)}
.btn{background:var(--ac);color:#10141a;border-radius:12px;padding:11px 16px;font-weight:700}.btn.g{background:var(--s2);color:var(--tx);border:1px solid var(--ln)}.btn.d{background:none;color:var(--er);border:1px solid var(--er)}.sm{padding:6px 10px;font-size:12px;border-radius:9px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.mw{position:fixed;inset:0;background:#000a;z-index:40;display:flex;align-items:flex-end;justify-content:center}.m{background:#0a0a0a;width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));animation:u .2s}@keyframes u{from{transform:translateY(14px);opacity:.4}}
@media(min-width:600px){.mw{align-items:center}.m{border-radius:20px}}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f{margin-bottom:10px}.f.w{grid-column:1/-1}.f label{display:block;font-size:12px;color:var(--mu);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px}.f input.bad{border-color:var(--er)}.err{color:var(--er);font-size:12px;min-height:16px}
.ty{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}.ty button{padding:9px 2px;border:1px solid var(--ln);border-radius:10px;font-size:12px;color:var(--mu)}.ty .on{background:var(--s2);color:var(--tx);border-color:var(--ac)}
.ls{display:grid;gap:6px;margin-bottom:12px}.ls .bar{height:5px}.ls div.r{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;font-size:12px}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#141414;border:1px solid #222;padding:10px 16px;border-radius:12px;z-index:60;max-width:90vw;font-size:13px}
.ach{display:flex;gap:12px;align-items:center}.badge{width:44px;height:44px;border-radius:50%;border:2px solid var(--ln);display:grid;place-items:center;font-weight:800;color:var(--mu);flex:none}.ach.u .badge{border-color:var(--ok);color:var(--ok)}.ach:not(.u){opacity:.6}
.cel{text-align:center;padding:10px}.cel .badge{width:78px;height:78px;margin:0 auto 12px;border-color:var(--ok);color:var(--ok);font-size:28px;animation:p .6s}@keyframes p{from{transform:scale(.7);opacity:0}}
.chart svg{width:100%;height:auto;display:block}.chip{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chip button{padding:6px 10px;border-radius:9px;border:1px solid var(--ln);font-size:12px;color:var(--mu)}.chip .on{background:var(--s2);color:var(--tx)}
.st{display:grid;grid-template-columns:1fr 1fr;gap:8px}.st div{background:var(--bg);border-radius:10px;padding:10px}.st b{display:block;font-size:18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--ln)}
.nt.un{border-inline-start:3px solid var(--ac);padding-inline-start:8px}


/* Professional calorie dashboard matching reference */
:root{--bg:#000000;--s:#0a0a0a;--s2:#141414;--ln:#1f1f1f;--tx:#f2f2f2;--mu:#8a8a8a;--ac:#3dd6ff;--pro:#ff4d6d;--carb:#4d8dff;--fat:#2dd4a0;--fiber:#a78bfa;--cal:#ff7a2e;--ok:#34d399;--wa:#fbbf24;--er:#f87171;--r:16px}
body{background:#000;font-size:14px;letter-spacing:.02px;color:var(--tx)}
.app{max-width:420px;padding:calc(10px + env(safe-area-inset-top)) 12px calc(108px + env(safe-area-inset-bottom))}
.top{margin-bottom:10px}.ib{background:#111;border-color:#222;border-radius:12px}.top input[type=date]{max-width:150px;background:#111;border-color:#222;color:var(--tx)}
.home-greeting{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 10px}.home-greeting h2{font-size:18px;line-height:1.2;margin:0 0 2px;font-weight:800;letter-spacing:-.3px}.home-greeting p{margin:0;color:var(--mu);font-size:11px}.greeting-mark{width:40px;height:40px;border-radius:50%;flex:none;position:relative;display:grid;place-items:center;background:conic-gradient(var(--ac) var(--gp),#1a1a1a 0);box-shadow:0 0 0 1px #222}
.greeting-mark::before{content:"";position:absolute;inset:3px;border-radius:50%;background:#0a0a0a;border:1px solid #1a1a1a}
.greeting-mark span{position:relative;z-index:1;font-size:10px;font-weight:800;color:var(--tx);font-variant-numeric:tabular-nums}
.streak-mini{display:inline-flex;align-items:center;gap:6px;padding:4px 9px 4px 5px;border-radius:99px;background:#111;border:1px solid #222;margin:0 0 10px;max-width:100%}
.streak-mini .si{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none}
.streak-mini .si svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.streak-mini .si.s0{background:#141414;color:#555}
.streak-mini .si.s1{background:#1a150c;color:#f0b060}
.streak-mini .si.s3{background:#1c1208;color:#ff9a3c}
.streak-mini .si.s7{background:#1c0c0c;color:#ff5a3c}
.streak-mini .si.s14{background:#1a0810;color:#ff4a7a}
.streak-mini .si.s30{background:#12081a;color:#c44aff}
.streak-mini .si.s50{background:#081018;color:#4ab0ff}
.streak-mini .si.s100{background:#1a1508;color:#ffd040}
.streak-mini .sn{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--tx)}
.streak-mini .sn small{font-size:10px;font-weight:600;color:var(--mu);margin-inline-start:3px}
.streak-mini .st-dots{display:flex;gap:3px;margin-inline-start:4px}
.streak-mini .st-dots i{width:5px;height:5px;border-radius:50%;background:#222}
.streak-mini .st-dots i.on{background:currentColor}
.streak-mini .st-dots i.today{outline:1px solid #555;outline-offset:1px}
.streak-mini.s1{color:#f0b060;border-color:#2a2010}.streak-mini.s3{color:#ff9a3c;border-color:#2a1808}

ch=`<svg viewBox="0 0 ${W} ${H}" role="img"><g style="stroke:var(--ln)"><line x1="${P}" x2="${W-10}" y1="${Y(mn)}" y2="${Y(mn)}"/><line x1="${P}" x2="${W-10}" y1="${Y(mx)}" y2="${Y(mx)}"/></g>${tw>0?`<line x1="${P}" x2="${W-10}" y1="${Y(tw)}" y2="${Y(tw)}" style="stroke:var(--wa)" stroke-dasharray="4 4"/>`:''}<polyline fill="none" style="stroke:var(--ac)" stroke-width="2" points="${a.map(w=>X(w.date)+','+Y(w.kg)).join(' ')}"/>${a.map(w=>`<circle cx="${X(w.date)}" cy="${Y(w.kg)}" r="4" style="fill:var(--ac)" tabindex="0" onclick="$('pt').textContent='${fd(w.date,{day:'numeric',month:'short',year:'numeric'})} · ${f(w.kg)} kg'"><title>${w.date}: ${f(w.kg)} kg</title></circle>`).join('')}<g style="fill:var(--mu)" font-size="9"><text x="2" y="${Y(mx)+3}">${f(mx)}</text><text x="2" y="${Y(mn)+3}">${f(mn)}</text><text x="${P}" y="${H-6}">${a[0].date}</text><text x="${W-10}" y="${H-6}" text-anchor="end">${a[a.length-1].date}</text></g></svg><small id="pt">kg</small>`}
const ch1=a.length>1?a[a.length-1].kg-a[0].kg:null,days=a.length>1?(new Date(a[a.length-1].date)-new Date(a[0].date))/864e5:0;
let tn='';if(a.length>=3&&days>=7){const wk=ch1/days*7;tn=`<p class="mu">${tr('wk')}: ${wk>0?'+':''}${f(Math.round(wk*100)/100*1)} kg · ${Math.abs(wk)<.1?tr('tFl'):wk>0?tr('tUp'):tr('tDn')}</p>`}else tn=`<p class="mu">${tr('needt')}</p>`;
const S=(k,v)=>`<div><small>${tr(k)}</small><b>${v}</b></div>`,sg=n=>n==null?'—':(n>0?'+':'')+f(n)+' kg';
let pr='—',lf='—';if(tw>0&&l){lf=f(Math.abs(l.kg-tw))+' kg';const s=all[0].kg;if(s!=tw)pr=Math.max(0,Math.round((s-l.kg)/(s-tw)*100))+'%'}
const E=wEdit?all.find(w=>w.id==wEdit):null;
return head()+`<div class="card"><div class="st">${S('latest',l?f(l.kg)+' kg':'—')}${S('prev',p?f(p.kg)+' kg':'—')}${S('chg',sg(ch1))}${S('fromF',l?sg(l.kg-all[0].kg):'—')}${S('tw',tw>0?f(tw)+' kg':'—')}${S('left',lf)}${S('pc',pr)}${S('cnt',all.length)}</div></div><div class="card"><div class="chip">${[7,30,90,180,365,0].map(r=>`<button class="${r==range?'on':''}" onclick="range=${r};render()">${tr('r'+r)}</button>`).join('')}</div><div class="chart">${ch}</div>${tn}</div><div class="card"><div class="fg"><div class="f"><label>${tr('date')}</label><input type="date" id="wd" value="${E?E.date:today()}"></div><div class="f"><label>${tr('weight')}</label><input id="wk" inputmode="decimal" value="${E?E.kg:''}"></div></div><div class="err" id="we"></div><button class="btn" onclick="saveW()">${tr('save')}</button></div><div class="card">${all.slice().reverse().map(w=>`<div class="row"><span>${fd(w.date,{day:'numeric',month:'short',year:'numeric'})}</span><b>${f(w.kg)} kg</b><span><button class="ib sm" onclick="wEdit='${w.id}';render()" aria-label="${tr('edit')}">${ic('ed')}</button> <button class="ib sm" onclick="delW('${w.id}')" aria-label="${tr('del')}">${ic('tr')}</button></span></div>`).join('')||`<p class="emp">${tr('needw')}</p>`}</div>`}
function saveW(){const d=$('wd').value,k=+nz($('wk').value);if(!vd(d)||!(k>=20&&k<=400)){$('we').textContent=tr('v_w');return}
const ex=D.weights.find(w=>w.date==d&&w.id!=wEdit);const commit=()=>{if(ex)D.weights=D.weights.filter(w=>w!==ex);
if(wEdit){const w=D.weights.find(x=>x.id==wEdit);if(w){w.date=d;w.kg=Math.round(k*10)/10}notify('n_wc',{},true)}else{D.weights.push({id:uid(),date:d,kg:Math.round(k*10)/10});notify('n_w',{},true)}
wEdit=null;save();achCheck(today());render()};if(ex)ask(tr('rep'),commit);else commit()}
function delW(id){ask(tr('delw'),()=>{D.weights=D.weights.filter(w=>w.id!=id);save();render()},tr('del'),1)}
function vAch(){const A=['first_meal','cal_d','pro_d','carb_d','fat_d','fiber_d','all_d','first_w','s3','s7','tw'],s=streak(date);
return head()+A.map(id=>{const dl=/_d$/.test(id),ks=Object.keys(D.ach).filter(k=>D.ach[k].id==id),u=ks.length>0,last=u?ks.map(k=>D.ach[k].date).sort().pop():'';const c=id=='first_meal'||id=='first_w'||id=='tw'?'c_'+id:dl?(id=='cal_d'?'c_cal_d':id=='all_d'?'c_all_d':'c_x_d'):'c_'+id;
const pr=id=='s3'||id=='s7'?`<div class="bar" style="margin-top:6px"><i style="width:${Math.min(100,s/(id=='s3'?3:7)*100)}%;background:var(--ok)"></i></div>`:'';
return`<div class="card ach ${u?'u':''}"><div class="badge">${u?'✓':'·'}</div><div style="flex:1"><b>${tr('a_'+id)}</b> <small>${tr(dl?'dly':'perm')}</small><br><small>${tr(c)}${id=='pro_d'||id=='carb_d'||id=='fat_d'||id=='fiber_d'?'':''}</small>${pr}${u?`<br><small>${esc(last)}${dl?' · '+tr('times',{n:ks.length}):''}</small>`:''}</div></div>`}).join('')}
function vSet(){const g=D.goals,fl=(id,k,v)=>`<div class="f"><label>${tr(k)}</label><input id="${id}" inputmode="decimal" value="${v}"></div>`,bs=window.Notification?Notification.permission:tr('bu');
return head()+`<div class="card"><h3>${tr('goals')}</h3><div class="fg">${fl('gC','cal',g.cal)}${fl('gP','pro',g.pro)}${fl('gCb','carb',g.carb)}${fl('gF','fat',g.fat)}${fl('gFi','fiber',g.fiber)}${fl('gT','tw',g.tw||'')}</div><div class="err" id="ge"></div><small>${tr('gnote')}</small><br><br><button class="btn" onclick="saveG()">${tr('save')}</button></div>
<div class="card"><h3>${tr('lang')}</h3><button class="btn g" onclick="setLang('ar')">عربي</button> <button class="btn g" onclick="setLang('en')">EN</button><div class="row"><label for="cm">${tr('msl')}</label><input type="checkbox" id="cm" ${D.prefs.ms?'checked':''} onchange="D.prefs.ms=this.checked;save()"></div><div class="row"><label for="cb">${tr('bn')} (${bs})</label><input type="checkbox" id="cb" ${D.prefs.bn?'checked':''} onchange="togBn(this)"></div><small>${tr('bnn')}</small></div>
<div class="card"><h3>${tr('theme')}</h3><div class="theme-row">${[['dark','th_dark'],['light','th_light'],['auto','th_auto']].map(([k,l])=>`<button class="btn ${(D.prefs.theme||'dark')==k?'':'g'}" onclick="setTheme('${k}')" aria-pressed="${(D.prefs.theme||'dark')==k}">${tr(l)}</button>`).join('')}</div></div>
<div class="card"><h3>${tr('data')}</h3><p><button class="btn g" onclick="expo()">${tr('exp')}</button> <button class="btn g" onclick="$('imf').click()">${tr('imp')}</button> <button class="btn g" onclick="rest()">${tr('restore')}</button> <button class="btn d" onclick="rst()">${tr('reset')}</button></p><input type="file" id="imf" accept=".json,application/json" hidden onchange="impo(this)"><small>${tr('about')}</small></div>`}
function saveG(){const v=id=>+nz($(id).value)||0,n={cal:v('gC'),pro:v('gP'),carb:v('gCb'),fat:v('gF'),fiber:v('gFi')};
if(!(n.cal>0&&n.pro>0&&n.carb>0&&n.fat>0&&n.fiber>=0)||Object.values(n).some(x=>x>20000)){$('ge').textContent=tr('v_g');return}
D.goals={...n,tw:v('gT')>0?v('gT'):0};const t=today();if(D.days[t])D.days[t].goals={...D.goals};save();notify('n_goal',{},true);achCheck(t);render()}
async function togBn(e){if(e.checked){if(!window.Notification){e.checked=false;return}const p=await Notification.requestPermission();D.prefs.bn=p=='granted';e.checked=D.prefs.bn}else D.prefs.bn=false;save();render()}
function expo(){const b=new Blob([JSON.stringify({...D,_v:2},null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='macrotrack-backup-'+today()+'.json';a.click();notify('n_exp',{},true);save()}
function impo(i){const fl=i.files[0];i.value='';if(!fl)return;const r=new FileReader();r.onload=()=>{let n=null;try{n=sane(JSON.parse(r.result))}catch(e){}if(!n){toast(tr('n_bad'));return}ask(tr('impq'),()=>{localStorage.setItem(K+'_prev',localStorage.getItem(K)||'');D=n;lang=D.prefs.lang;applyTheme();save();notify('n_imp',{},true);render()})};r.readAsText(fl)}
function rest(){let n=null;try{n=sane(JSON.parse(localStorage.getItem(K+'_prev')||'null'))}catch(e){}if(!n){toast(tr('n_bad'));return}ask(tr('impq'),()=>{D=n;lang=D.prefs.lang;applyTheme();save();render()})}
function rst(){ask(tr('resq'),()=>{localStorage.setItem(K+'_prev',localStorage.getItem(K)||'');D=def();D.prefs.lang=lang;applyTheme();save();render()},tr('reset'),1)}
const RT=()=>document.documentElement.getAttribute('data-theme')||'dark';
function applyTheme(){let t=D&&D.prefs&&D.prefs.theme;if(t!='light'&&t!='auto')t='dark';if(t=='auto'){try{t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}catch(e){t='dark'}}
document.documentElement.setAttribute('data-theme',t);const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t=='light'?'#f3f5f8':'#000000')}
function setTheme(t){D.prefs.theme=t;save();applyTheme();render()}
function togTheme(){setTheme(RT()=='dark'?'light':'dark')}
try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{if(D.prefs.theme=='auto'){applyTheme();render()}})}catch(e){}
function setLang(l){lang=l;D.prefs.lang=l;save();render()}
function openBell(){D.notes.forEach(n=>n.read=true);save();render();$('mr').innerHTML=`<div class="mw" onclick="if(event.target==this)closeM()"><div class="m" role="dialog" aria-modal="true"><div class="rh"><h3>${tr('bell')}</h3><span>${D.notes.length?`<button class="btn g sm" onclick="ask(tr('clrq'),()=>{D.notes=[];save();openBell()},tr('clr'),1)">${tr('clr')}</button>`:''} <button class="btn g sm" onclick="closeM()" aria-label="x">✕</button></span></div>${D.notes.map(n=>`<div class="row nt"><span>${esc(tr(n.k,n.p))}</span><small>${new Date(n.ts).toLocaleString(lang=='ar'?'ar-u-nu-latn':'en-GB',{dateStyle:'short',timeStyle:'short'})}</small></div>`).join('')||`<p class="emp">${tr('noN')}</p>`}</div></div>`}
let cf=null;
function ask(msg,fn,label,danger){cf=fn;$('cfm').innerHTML=`<div class="mw cfw" role="alertdialog" aria-modal="true"><div class="m cfc"><p>${esc(msg)}</p><div class="cfb"><button class="btn g" onclick="askR(0)">${tr('cancel')}</button><button class="btn ${danger?'d':''}" onclick="askR(1)">${esc(label||tr('ok'))}</button></div></div></div>`}
function askR(v){const fn=cf;cf=null;$('cfm').innerHTML='';if(v&&fn)fn()}
const hp=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}};
document.addEventListener('contextmenu',e=>{if(!/INPUT|TEXTAREA/.test(e.target.tagName))e.preventDefault()});
function closeM(){$('mr').innerHTML='';dirty=false}
function openAdd(id){editId=id||null;const m=id?D.meals.find(x=>x.id==id):null;selType=m?m.type:'breakfast';dirty=false;const v=k=>m?m[k]||'':'',fl=(i,k,x)=>`<div class="f"><label>${tr(k=='cal'?'kc':k)}${k=='cal'?'':' (g)'}</label><input id="${i}" inputmode="decimal" value="${x}" oninput="dirty=true;live()"></div>`;
$('mr').innerHTML=`<div class="mw" onclick="if(event.target==this)tryClose()"><div class="m" role="dialog" aria-modal="true"><div class="rh"><h3>${tr(m?'edit':'add')}</h3><button class="btn g sm" onclick="tryClose()" aria-label="x">✕</button></div><div class="ls" id="ls"></div><div class="f"><label>${tr('name')}</label><input id="fN" maxlength="80" value="${esc(v('name'))}" oninput="dirty=true"></div><div class="ty" id="ty"></div><div class="fg">${fl('fC','cal',v('cal'))}${fl('fP','pro',v('pro'))}${fl('fCb','carb',v('carb'))}${fl('fF','fat',v('fat'))}${fl('fFi','fiber',v('fiber'))}</div><small id="hn"></small><div class="f" style="margin-top:8px"><label>${tr('notes')}</label><textarea id="fNt" rows="2" maxlength="200" oninput="dirty=true">${esc(v('note'))}</textarea></div><div class="err" id="fe"></div><button class="btn" id="sv" onclick="saveMeal()">${tr('save')}</button> <button class="btn g" onclick="tryClose()">${tr('cancel')}</button></div></div>`;tys();live();setTimeout(()=>$('fN').focus(),50)}
function tys(){$('ty').innerHTML=['breakfast','lunch','dinner','snack'].map(t=>`<button class="${t==selType?'on':''}" onclick="selType='${t}';dirty=true;tys()">${tr(t)}</button>`).join('')}
const fv=i=>{const s=nz($(i).value);return s==''?0:(/^\d*\.?\d+$/.test(s)?+s:NaN)};
function live(){const g=gl(date),t=tot(date,editId),x={cal:fv('fC'),pro:fv('fP'),carb:fv('fCb'),fat:fv('fF'),fiber:fv('fFi')};const d=(x.pro||0)*4+(x.carb||0)*4+(x.fat||0)*9;
if(!(x.cal>0)&&d>0)x.calAuto=d;const cv=x.cal>0?x.cal:d;
$('ls').innerHTML=N.map(k=>{const v=t[k]+(k=='cal'?cv:(x[k]||0)),p=pc(v,g[k]);return`<div class="r"><span>${tr(k)}</span><div class="bar"><i style="width:${Math.min(100,p)}%;background:var(${v>g[k]&&g[k]>0?'--wa':'--'+k})"></i></div><span>${f(v)}/${f(g[k])}</span></div>`}).join('');$('hn').textContent=tr('hint',{a:f(d)})}
function tryClose(){if(dirty){ask(tr('discard'),closeM,tr('close'));return}closeM()}
let busy=false;
function saveMeal(){if(busy)return;const n=$('fN').value.trim(),x={cal:fv('fC'),pro:fv('fP'),carb:fv('fCb'),fat:fv('fF'),fiber:fv('fFi')};const e=$('fe');
if(!n){e.textContent=tr('v_name');return}if(Object.values(x).some(v=>isNaN(v)||v<0||v>20000)){e.textContent=tr('v_num');return}
const d=x.pro*4+x.carb*4+x.fat*9;if(!x.cal&&!d&&!x.fiber){e.textContent=tr('v_none');return}
busy=true;$('sv').disabled=true;if(!x.cal)x.cal=d;const o={...x,name:n,type:selType,note:$('fNt').value.trim(),date:date};
if(editId){const m=D.meals.find(z=>z.id==editId);Object.assign(m,o)}else{D.meals.push({id:uid(),ts:Date.now(),...o});if(!D.days[date])D.days[date]={goals:{...D.goals}}}
save();closeM();notify(editId?'n_edit':'n_add',{n},true);msCheck(date);achCheck(date);editId=null;busy=false;render()}
function delMeal(id){ask(tr('delq'),()=>{D.meals=D.meals.filter(m=>m.id!=id);save();notify('n_del',{},true);render()},tr('del'),1)}
function go(v){hp();view=v;wEdit=null;render();scrollTo(0,0)}
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang=='ar'?'rtl':'ltr';document.title='MacroTrack';
$('app').innerHTML={home:vHome,prog:vProg,ach:vAch,set:vSet}[view]();$('fab').style.display=view=='home'?'grid':'none';
$('nav').innerHTML=['home','prog','ach','set'].map(v=>`<button class="${v==view?'on':''}" onclick="go('${v}')" ${v==view?'aria-current="page"':''}>${ic(v)}${tr(v)}</button>`).join('')}
D=load();applyTheme();lang=D.prefs.lang=='en'?'en':'ar';date=today();save();render();
</script></body></html>
